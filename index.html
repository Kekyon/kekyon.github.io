<body>
	<div class="parallax"></div>


<head>  
			<link rel="stylesheet" href="style.css">
 		 <meta name="viewport" content="width=device-width">
 		 <link rel="preconnect" href="https://fonts.gstatic.com">
		<link href="https://fonts.googleapis.com/css2?family=Texturina:wght@900&display=swap" rel="stylesheet">

</head>

<body>

	<main>
<picture>

  <pre><img src="Dicksucker-logo-new.jpg"  alt="Door Stuck!" style="width:1890px;height:100%;">

   </pre>  
     </picture>
		

	</main>

<div>
		<div id="navbar" class="sticky">
	<a href="https://buryon.ca/">Home</a>
	<a href="https://bsky.app/profile/buryon.ca">BlueSky</a>
	<a href="https://www.instagram.com/b.uryon/">Instagram</a>  
	<a href="https://www.youtube.com/@ClickDude">YouTube</a>  

			
</div>

    <audio src="./assets/music/Baboon.mp3" id="song"></audio>

    <div class="container">  
        <div class="box"></div>      
        <img src="./assets/images/baboon.jpg" id="thumbnail" />
        
        <img src="./assets/icons/play.png" onclick="playPause()" id="play-pause" />
        <img src="./assets/icons/forward.png" onclick="nextSong()" id="next-song" />
        <img src="./assets/icons/backward.png" onclick="previousSong()" id="previous-song" />

     

        <!-- Input element for progress bar - min=0 starting value of every song - max length will change per song so leave empty -->
        
        <input 
            type="range" 
            id="progress-bar" 
            min="0" 
            max="" 
            value="0" 
            onchange="changeProgressBar()"
        />

        <div class="currentTime"></div>
        <div class="durationTime"></div>
    </div>

    <script src="player.js"></script>
</body>
